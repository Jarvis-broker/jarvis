[package]
name = "jarvis-app"
version = "0.3.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jarvis_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
# Auto-update: updater downloads + verifies signed bundles against the pubkey
# in tauri.conf.json; process enables relaunch after install.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
base64 = "0.22"

# Activation key gating: HMAC validation + local 0600 file storage +
# server-side entitlement check (phone-home verify against the club bot).
hmac = "0.12"
ureq = { version = "2", features = ["json"] }

# A2 memory layer: SQLite + sqlite-vec extension
rusqlite = { version = "0.31", features = ["bundled"] }
sqlite-vec = "0.1"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
sha2 = "0.10"
zerocopy = "0.7"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt", "time"] }

